name: strata-build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  HUGO_VERSION: '0.161.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --minify

      - name: Verify landing output
        run: |
          test -f public/index.html
          test -f public/assets/style.css
          grep -q "Infrastructure" public/index.html
          grep -q "sretoolhub.com" public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
