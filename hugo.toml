baseURL = 'https://stratasre.com/'
locale = 'en-us'
title = 'Strata'

# The static landing page is the site. Hugo is kept only as a build wrapper for
# hosts that expect a Hugo project; it copies landing/ into public/ verbatim.
disableHugoGeneratorInject = true
staticDir = ['static', 'landing']
disableKinds = ['page', 'section', 'taxonomy', 'term', 'RSS', 'sitemap', 'robotsTXT', '404']

[params]
  description = 'Open-source infrastructure that remembers: MonoFS, Guardian, Doctor, LB-Edge, and Agent.'
  author = 'Strata'

[markup.goldmark.renderer]
  unsafe = true

[minify]
  # The landing page carries a CSP hash for its inline JSON-LD. Keep the HTML
  # byte-stable so the hash stays valid.
  disableHTML = true
